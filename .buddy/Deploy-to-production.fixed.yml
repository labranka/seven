- pipeline: deploy_to_production
  name: Deploy to production
  refs:
  - refs/heads/development
  events:
  - type: PUSH
  fail_on_prepare_env_warning: true
  actions:
  - action: Transfer to Shopify/Seven/main
    type: SHOPIFY
    integration: seven777
    theme: Seven/main
    deployment_excludes:
    - '*.json'
    - assets/*.svg
    deployment_includes:
    - settings_schema.json
